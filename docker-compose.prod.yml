version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# SAFE Platform — Production Docker Compose
# Services: nginx (LB + TLS + rate limiting) | main-backend | ai-backend | frontend
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Nginx: Load Balancer + Rate Limiter + Reverse Proxy ─────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: safe_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./frontend/dist:/var/www/html:ro         # Astro build output
    depends_on:
      - main-backend
      - ai-backend
    networks:
      - safe_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Certbot: SSL Certificate Renewal ────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: safe_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done'"

  # ── Main FastAPI Backend ─────────────────────────────────────────────────────
  main-backend:
    build:
      context: ./security-safe-chat/security-safe-chat-backend
      dockerfile: Dockerfile
    container_name: safe_main_backend
    restart: unless-stopped
    env_file:
      - ./security-safe-chat/security-safe-chat-backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=4
    expose:
      - "8000"
    volumes:
      - blog_data:/app/data          # persist blogs_store.json
    networks:
      - safe_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

  # ── AI FastAPI Backend (Digital Arrest Detector) ─────────────────────────────
  ai-backend:
    build:
      context: ./digital-arrest
      dockerfile: Dockerfile
    container_name: safe_ai_backend
    restart: unless-stopped
    env_file:
      - ./digital-arrest/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - WORKERS=2
    expose:
      - "8001"
    networks:
      - safe_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  blog_data:

networks:
  safe_net:
    driver: bridge
