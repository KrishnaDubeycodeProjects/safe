<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Error — SAFE Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(16px);
    }
    .icon { font-size: 52px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; color: #ef4444; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 16px; }
    .helpline {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      color: #fca5a5;
      font-weight: 500;
      margin-top: 20px;
    }
    a { color: #60a5fa; text-decoration: none; }
    .back-btn {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 24px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚙️</div>
    <h1>Something Went Wrong</h1>
    <p>Our server ran into an unexpected issue. Our team has been notified and is working on a fix.</p>
    <p>Please try again in a few minutes.</p>
    <div class="helpline">
      🆘 For urgent cyber crime help:<br/>
      Call <strong>1930</strong> or visit <a href="https://cybercrime.gov.in" target="_blank">cybercrime.gov.in</a>
    </div>
    <a href="/" class="back-btn">← Back to SAFE</a>
  </div>
</body>
</html>
