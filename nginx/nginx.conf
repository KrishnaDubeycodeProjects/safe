# ────────────────────────────────────────────────────────────────────────────────
# nginx.conf — SAFE Platform Production
# Features: Rate limiting | Load balancing | Security headers | TLS | Gzip
# ────────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # ── Timeouts ─────────────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    client_max_body_size 10m;       # Max upload (scan images etc.)
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    # ── Gzip Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;

    # ── Rate Limiting Zones ───────────────────────────────────────────────────────
    # General API: 30 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/m;

    # Scan endpoint: 10 req/min per IP (heavier compute)
    limit_req_zone $binary_remote_addr zone=api_scan:10m rate=10r/m;

    # Blog submit: 5 req/min per IP (anti-spam)
    limit_req_zone $binary_remote_addr zone=api_blog_submit:10m rate=5r/m;

    # Community report: 5 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_report:10m rate=5r/m;

    # Admin panel: 10 req/min per IP (tight)
    limit_req_zone $binary_remote_addr zone=api_admin:10m rate=10r/m;

    # Feedback: 5 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_feedback:10m rate=5r/m;

    limit_req_status 429;

    # ── Connection Limiting ───────────────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upstreams (load balanced) ─────────────────────────────────────────────────
    upstream main_backend {
        least_conn;
        server main-backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream ai_backend {
        least_conn;
        server ai-backend:8001 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Main Server ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name YOUR_DOMAIN.COM;          # ← replace with your domain

        # ── TLS ───────────────────────────────────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.COM/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.COM/privkey.pem;
        ssl_session_cache   shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_stapling        on;
        ssl_stapling_verify on;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ── Security Headers ──────────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self' 'unsafe-inline' https://cdn.quilljs.com https://cdn.jsdelivr.net; "
            "style-src 'self' 'unsafe-inline' https://cdn.quilljs.com https://fonts.googleapis.com; "
            "font-src 'self' https://fonts.gstatic.com; "
            "img-src 'self' data: blob:; "
            "connect-src 'self'; "
            "frame-ancestors 'none';"
            always;

        # ── Connection limit ──────────────────────────────────────────────────────
        limit_conn conn_limit 20;

        # ── Static Frontend (Astro build) ─────────────────────────────────────────
        root /var/www/html;
        index index.html;

        location / {
            try_files $uri $uri/ $uri.html /index.html =404;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # ── Main Backend API ──────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://main_backend;
            include /etc/nginx/snippets/proxy_params.conf;
        }

        location /api/scan/ {
            limit_req zone=api_scan burst=5 nodelay;
            proxy_pass http://main_backend;
            include /etc/nginx/snippets/proxy_params.conf;
            proxy_read_timeout 60s;
        }

        location /api/blogs/submit {
            limit_req zone=api_blog_submit burst=3 nodelay;
            proxy_pass http://main_backend;
            include /etc/nginx/snippets/proxy_params.conf;
            client_max_body_size 2m;
        }

        location /api/blogs/approve {
            limit_req zone=api_admin burst=10 nodelay;
            proxy_pass http://main_backend;
            include /etc/nginx/snippets/proxy_params.conf;
        }

        location /api/blogs/reject {
            limit_req zone=api_admin burst=10 nodelay;
            proxy_pass http://main_backend;
            include /etc/nginx/snippets/proxy_params.conf;
        }

        location /api/blogs/pending {
            limit_req zone=api_admin burst=10 nodelay;
            proxy_pass http://main_backend;
            include /etc/nginx/snippets/proxy_params.conf;
        }

        location /api/feedback {
            limit_req zone=api_feedback burst=3 nodelay;
            proxy_pass http://main_backend;
            include /etc/nginx/snippets/proxy_params.conf;
        }

        location /api/v1/chat {
            limit_req zone=api_scan burst=8 nodelay;
            proxy_pass http://main_backend;
            include /etc/nginx/snippets/proxy_params.conf;
            proxy_read_timeout 90s;
        }

        # ── AI Backend API ────────────────────────────────────────────────────────
        location /api/community/ {
            limit_req zone=api_general burst=15 nodelay;
            proxy_pass http://ai_backend;
            include /etc/nginx/snippets/proxy_params.conf;
        }

        location /api/community/report {
            limit_req zone=api_report burst=3 nodelay;
            proxy_pass http://ai_backend;
            include /etc/nginx/snippets/proxy_params.conf;
        }

        location /api/community/search/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://ai_backend;
            include /etc/nginx/snippets/proxy_params.conf;
            proxy_read_timeout 30s;
        }

        # ── Block bad bots & scanners ─────────────────────────────────────────────
        location ~* \.(php|asp|aspx|jsp|cgi|sh|bash|py)$ {
            deny all;
            return 404;
        }
        location ~* (\.env|\.git|\.htaccess|wp-admin|xmlrpc\.php|phpmyadmin) {
            deny all;
            return 404;
        }

        # ── Error pages ───────────────────────────────────────────────────────────
        error_page 429 /429.html;
        error_page 500 502 503 504 /50x.html;
    }
}
